# Quick start: `make up` (blocks until the `app` service reports healthy —
# see its Dockerfile HEALTHCHECK) -> `make seed` (populates a realistic
# demo dataset, runs INSIDE this already-migrated `app` container via
# `docker compose exec`, so it shares its DATABASE_URL) -> `make demo`
# (walks one order through the live REST API from the host, prints the
# resulting trial balance). Seeding is deliberately opt-in, never automatic
# on `up` -- it is not idempotent-by-luck, it is idempotent by design
# (Week 7 hardening brief, Decision 4), but auto-seeding on every boot
# would still surprise anyone pointing this compose file at real data.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mini_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_erp}
      POSTGRES_DB: ${POSTGRES_DB:-mini_erp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mini_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mini_erp}:${POSTGRES_PASSWORD:-mini_erp}@postgres:5432/${POSTGRES_DB:-mini_erp}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    ports:
      - "${APP_PORT:-8000}:8000"
    # Run migrations then start the API — fine for a Week-1 single-instance
    # setup; a real deployment would run migrations as a separate release
    # step rather than on every container start.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  mini_erp_pgdata:
