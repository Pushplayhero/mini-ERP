[project]
name = "mini-erp"
version = "0.1.0"
description = "A minimal, correctness-obsessed open-source ERP kernel — Order-to-Cash + multi-company/multi-currency/UoM groundwork. Phase 1 (Kernel) of the open-erp master plan."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "open-erp contributors" }]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "argon2-cffi>=23.1,<24",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
    "import-linter>=2.1,<3",
    "testcontainers[postgres]>=4.8,<5",
    # Fallback embedded-Postgres backend for local/sandboxed test runs where a
    # Docker daemon is not available (see tests/conftest.py). Real CI always
    # uses a Postgres service container, never this fallback.
    "pgserver>=0.1.0",
    "asgi-lifespan>=2.1,<3",
    # Property-based testing for ledger's balance invariant (ADR-005 Action
    # Item 4 / Week 2 brief): random-but-balanced line generation, asserting
    # the trial balance holds for every generated sequence of entries.
    "hypothesis>=6.100,<7",
    # Week 8 Decision 2: coverage measurement + a live, CI-generated badge
    # (never a static/hand-edited one). coverage-badge reads the same
    # .coverage data pytest-cov produces; no third-party account needed.
    "pytest-cov>=6.0,<7",
    "coverage-badge>=1.1,<2",
    # coverage-badge 1.1.2 (unmaintained since 2023) hard-imports
    # pkg_resources without pinning setuptools; setuptools >=81 no longer
    # ships pkg_resources by default, so an unpinned resolve breaks
    # coverage-badge at runtime (ModuleNotFoundError). Pin explicitly so
    # `uv sync` always resolves a setuptools that still has it.
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
# ruff — lint + format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "PL", "RUF", "N", "W",
]
ignore = [
    "PLR0913", # too many arguments — routers/services legitimately take several DTOs
    "PLR0912",
    "PLR2004", # magic value comparison — noisy for status codes / small constants
    "PLW0603", # `global` for lazily-initialized module-level singletons (engine/session factory)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PLR2004", "S101"]
# Week 7 Decision 1: the full O2C flow is deliberately ONE test function
# (per-step delta assertions read as one linear narrative, not split
# across helpers) -- PLR0915 (too many statements) is expected here, not
# a code smell to fix.
"tests/e2e/*" = ["PLR0915"]
"alembic/*" = ["ARG001", "N999"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# mypy — strict
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pgserver.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore::DeprecationWarning:pgserver.*",
]

# --------------------------------------------------------------------------
# import-linter — enforce modular-monolith boundaries (CI-gated)
# --------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core must not import business modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "business modules are independent (no cross-module model/repository imports)"
type = "independence"
modules = [
    "app.modules.masterdata",
    "app.modules.sales",
    "app.modules.inventory",
    "app.modules.receivables",
    "app.modules.ledger",
]

[[tool.importlinter.contracts]]
name = "masterdata must not import other business modules"
type = "forbidden"
source_modules = ["app.modules.masterdata"]
forbidden_modules = [
    "app.modules.sales",
    "app.modules.inventory",
    "app.modules.receivables",
    "app.modules.ledger",
]

# ADR-006 Decision 2: plugins may import core/modules freely; the reverse is
# forbidden — these two contracts are what makes that direction CI-enforced
# physics instead of a review-time convention.
[[tool.importlinter.contracts]]
name = "core must not import plugins"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.plugins"]

[[tool.importlinter.contracts]]
name = "business modules must not import plugins"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.plugins"]

# ADR-009 Decision 9 / WEEK9 Slice C: the same "dependency inversion at the
# composition root" shape ADR-006 already CI-enforces for plugins, now for
# `app.platform` — business modules depend only on the `app.core.
# authorization` port; `app.main` (composition root) is the only place
# allowed to import both `app.core` and `app.platform` and wire them
# together (mirrors how `app.main` is already the sole plugin-wiring point).
[[tool.importlinter.contracts]]
name = "core must not import platform"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.platform"]

[[tool.importlinter.contracts]]
name = "business modules must not import platform"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.platform"]

# Decision 9's "may import app.core and app.modules.masterdata only, among
# app-internal packages" — `platform.permissions` needs `masterdata` for
# company-existence checks (Phase 2 overview §5.1's permissions ->
# masterdata edge). Expressed as an explicit forbidden-list, the same shape
# "masterdata must not import other business modules" above already uses,
# since `forbidden` contracts have no formal allowlist mode — this list is
# every OTHER specific `app.*` submodule that exists (or, per Codex
# diff-review round-1 finding, could soon exist in a currently-named
# shape), not just the business modules:
# - `app.modules.sales/inventory/receivables/ledger`, `app.plugins`
#   (round 1's original list — the modules that exist today).
# - `app.platform.plugins/customfields/workflow/integration` (round 1
#   finding): sibling platform modules the PHASE2 overview already names,
#   none built yet — empirically confirmed import-linter accepts a
#   `forbidden_modules` entry with no corresponding real module (the
#   contract just never triggers until one exists to import). The next
#   platform module's own ADR/brief must add the analogous entry here for
#   `permissions`, the same way this slice does for what exists today.
# - `app.main`, `app.cli` (round 2 finding): the composition root and CLI
#   scripts are also `app`-internal packages `platform.permissions` must
#   never depend on — the dependency direction runs the other way (`app.
#   main`/CLI scripts import `platform.permissions`, never the reverse).
[[tool.importlinter.contracts]]
name = "platform.permissions may depend on core and masterdata only"
type = "forbidden"
source_modules = ["app.platform.permissions"]
forbidden_modules = [
    "app.modules.sales",
    "app.modules.inventory",
    "app.modules.receivables",
    "app.modules.ledger",
    "app.plugins",
    "app.platform.plugins",
    "app.platform.customfields",
    "app.platform.workflow",
    "app.platform.integration",
    "app.main",
    "app.cli",
]

# Closes the one gap the contract above structurally cannot (Codex
# diff-review rounds 3/4): a bare `import app`/`app.modules`/`app.platform`
# statement, which a purely-enumerated `forbidden` list never catches
# (import-linter only sees the exact static import target, not an
# attribute later reached via a package Python already populated because
# some OTHER file imported the real submodule first), AND — round 3's own
# first attempt at fixing this got it wrong twice, both empirically caught
# before landing, not assumed — a `forbidden` contract cannot express this
# either way: (a) adding `app.platform` to a `forbidden_modules` list whose
# `source_modules` is itself `app.platform.permissions`, a subpackage of
# `app.platform`, is silently a no-op — `ForbiddenContract`'s own docstring
# states overlapping source/forbidden pairs are skipped entirely, confirmed
# by reading `importlinter/contracts/forbidden.py` directly; (b) adding
# bare `app`/`app.modules` the same way would also forbid their required
# descendants (`app.core`, `app.modules.masterdata`) — confirmed via a
# throwaway probe contract, since removed, that a `forbidden` contract's
# ancestor-forbid is unconditional with no way to carve out one exception.
# The `protected` contract type (`as_packages = false`) is the correct
# tool instead: it operates on the literal import target only, so
# protecting bare `app`/`app.modules`/`app.platform` from any importer
# does NOT also protect `app.modules.masterdata` or `app.core` — verified
# with two more throwaway probes, since removed: one importing bare
# `app.modules` from a scratch file (correctly BROKEN), one confirming
# `app.cli.replay_outbox`'s real `from app import main` does NOT register
# as a bare-`app` import (correctly KEPT, so this doesn't need an allowed-
# importers exception). No `source_modules` scoping is possible on a
# `protected` contract (it protects the listed modules from every
# importer, not from one named source) — applied globally rather than
# `platform.permissions`-only is intentional here, since no file in this
# codebase has any legitimate reason to import any of these three bare.
[[tool.importlinter.contracts]]
name = "no bare imports of app / app.modules / app.platform package roots"
type = "protected"
protected_modules = ["app", "app.modules", "app.platform"]
allowed_importers = []
as_packages = false
