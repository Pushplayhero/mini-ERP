name: Coverage

# Week 8 Decision 2 (docs/adr/WEEK8-phase1-polish-brief.md): a live,
# CI-generated coverage badge, never a static/hand-edited one.
#
# Workflow-level triggers, job-level `if` conditions inside (GitHub
# Actions triggers live at the workflow level, not the job level).
on:
  pull_request: {}
  push:
    branches: [main]
    # No anti-recursion mechanism needed: the coverage-badge job's bot
    # commit lands on a separate `badges` branch (never `main` -- see the
    # coverage-badge job below), and this workflow's push trigger only
    # fires for `main`, so the bot's own commit can never retrigger it.

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://mini_erp:mini_erp@localhost:5432/mini_erp

jobs:
  # PR-only: informational coverage number in the PR's checks. Default
  # (read-only) permissions — works unmodified on fork PRs.
  coverage-check:
    name: coverage (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: mini_erp
          POSTGRES_DB: mini_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.12.18"
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-report=term

  # push-to-main step 1 (READ-ONLY): execute migrations, test suite, and badge
  # rendering under `contents: read` so project/dependency code never runs
  # with repository-write credentials (D.5 u13 governance remediation).
  coverage-generate:
    name: coverage generate (read-only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: mini_erp
          POSTGRES_DB: mini_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.12.18"
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-report=term
      - run: mkdir -p /tmp/badge-out
      - run: uv run coverage-badge -o /tmp/badge-out/coverage.svg -f
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-badge-svg
          path: /tmp/badge-out/coverage.svg
          if-no-files-found: error
          retention-days: 1

  # push-to-main step 2 (WRITE-ISOLATED): publishes the pre-rendered SVG to the
  # `badges` branch without installing dependencies or executing repository code.
  coverage-badge:
    name: coverage badge publish
    if: github.event_name == 'push'
    needs: [coverage-generate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-badge-svg
          path: /tmp/badge-in
      - name: Validate SVG artifact before checkout
        run: |
          test -f /tmp/badge-in/coverage.svg
          test ! -L /tmp/badge-in/coverage.svg
          size=$(wc -c < /tmp/badge-in/coverage.svg)
          test "$size" -gt 0 -a "$size" -le 65536
          grep -q "<svg" /tmp/badge-in/coverage.svg
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Publish badge to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --no-tags origin refs/heads/badges:refs/remotes/origin/badges
            git worktree add --track -b badges /tmp/badges-wt origin/badges
          else
            git worktree add --orphan -b badges /tmp/badges-wt
          fi
          cp /tmp/badge-in/coverage.svg /tmp/badges-wt/coverage.svg
          cd /tmp/badges-wt
          git add coverage.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge [ci]"
          git push origin badges
