name: Coverage

# Week 8 Decision 2 (docs/adr/WEEK8-phase1-polish-brief.md): a live,
# CI-generated coverage badge, never a static/hand-edited one.
#
# Workflow-level triggers, job-level `if` conditions inside (GitHub
# Actions triggers live at the workflow level, not the job level).
on:
  pull_request: {}
  push:
    branches: [main]
    # No anti-recursion mechanism needed: the coverage-badge job's bot
    # commit lands on a separate `badges` branch (never `main` -- see the
    # coverage-badge job below), and this workflow's push trigger only
    # fires for `main`, so the bot's own commit can never retrigger it.

env:
  DATABASE_URL: postgresql+asyncpg://mini_erp:mini_erp@localhost:5432/mini_erp

jobs:
  # PR-only: informational coverage number in the PR's checks. Default
  # (read-only) permissions — works unmodified on fork PRs.
  coverage-check:
    name: coverage (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: mini_erp
          POSTGRES_DB: mini_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-report=term

  # push-to-main only: regenerate the badge and commit it to a SEPARATE
  # `badges` branch (never `main` -- `main` is protected by a required-
  # status-checks ruleset with no bypass actors, and this job intentionally
  # has none either; a persistent branch, not an ephemeral Actions
  # artifact, so README can link something that doesn't expire or require
  # auth).
  coverage-badge:
    name: coverage badge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two near-simultaneous pushes to main would otherwise run this job
    # concurrently: each checks out the SHA that triggered it, computes
    # coverage for that stale snapshot, then races to commit+push the
    # badge -- one push can be rejected, or an older badge can "win".
    # Serializing per-ref plus re-checking out the live branch tip below
    # (not the frozen trigger SHA) means only the latest push's coverage
    # ever gets committed.
    concurrency:
      group: coverage-badge-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: mini_erp
          POSTGRES_DB: mini_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Live branch tip, not the (possibly already-superseded) SHA
          # that triggered this run -- see the concurrency comment above.
          ref: main
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-report=term
      - run: mkdir -p /tmp/badge-out
      - run: uv run coverage-badge -o /tmp/badge-out/coverage.svg -f
      - name: Publish badge to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A separate worktree for the `badges` branch, independent of
          # this job's `main` checkout above -- `main`'s working tree is
          # never touched by this step. `actions/checkout@v4` only fetches
          # `main` by default, so `origin/badges` has no local
          # remote-tracking ref yet -- fetch it explicitly before
          # `git worktree add` can resolve it. `--orphan` on the
          # first-ever run (no `badges` branch exists yet); a normal
          # tracked worktree checkout on every run after that.
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --no-tags origin refs/heads/badges:refs/remotes/origin/badges
            git worktree add --track -b badges /tmp/badges-wt origin/badges
          else
            git worktree add --orphan -b badges /tmp/badges-wt
          fi
          cp /tmp/badge-out/coverage.svg /tmp/badges-wt/coverage.svg
          cd /tmp/badges-wt
          git add coverage.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge [ci]"
          git push origin badges
